  const lightbox = document.querySelector("[data-image-lightbox]");

  const isZoomableImage = (node) =>

  const resolveZoomableImage = (target) => {
    if (isZoomableImage(target)) {
      return target;
    }

    if (!(target instanceof Element)) {
      return null;
    }

    const triggerImage = target.closest("[data-lightbox-trigger]")?.querySelector("img");
    return isZoomableImage(triggerImage) ? triggerImage : null;

  const syncZoomableImages = () => {
    document.querySelectorAll(zoomableSelector).forEach((image) => {
      if (!(image instanceof HTMLImageElement)) return;

      const zoomable = isZoomableImage(image);
      const trigger = image.closest("[data-lightbox-trigger]");

      image.classList.toggle("zoomable-media", zoomable);
      trigger?.classList.toggle("zoomable-media", zoomable);

      if (zoomable && !trigger) {

    shell: document.querySelector("[data-search-shell]"),
    statusNode: document.querySelector("[data-search-status]"),
    host: document.querySelector("#search")
  });

  const loadScript = (src) =>
    new Promise((resolve, reject) => {
      const existing = document.querySelector(`script[src="${src}"]`);
      if (existing) {
        resolve(existing);
        return;
      }

      const script = document.createElement("script");
      script.src = src;
      script.onload = () => resolve(script);
      script.onerror = reject;
      document.head.appendChild(script);
    });

  const loadStyle = (href) => {
    if (document.querySelector(`link[href="${href}"]`)) {
      return;
    }

    const link = document.createElement("link");
    link.rel = "stylesheet";
    link.href = href;
    document.head.appendChild(link);
  };

  const loadAssets = async () => {
    if (!window.__searchAssetsPromise) {
      window.__searchAssetsPromise = (async () => {
        loadStyle("/pagefind/pagefind-ui.css");
        await loadScript("/pagefind/pagefind-ui.js");

        if (!window.PagefindUI) {
          throw new Error("PagefindUI unavailable");
        }
      })();
    }

    return window.__searchAssetsPromise;
  };

  const initSearch = async () => {
    const { host, statusNode } = resolveSearchNodes();

    if (!host || !statusNode || host.dataset.searchInitialized === "true") {
      return;
    }

    try {
      await loadAssets();

      new window.PagefindUI({
        element: "#search",
        showImages: false,
        showSubResults: true,
        excerptLength: 16,
        resetStyles: false
      });
      statusNode.textContent = "Search across titles, tags, summaries, and article content.";
      host.dataset.searchInitialized = "true";
    } catch (error) {
      statusNode.textContent =
        "Search assets failed to load. Run npm run build to refresh the Pagefind bundle.";
    }
  };

  const show = async () => {
    const { shell } = resolveSearchNodes();
    if (!shell) return;

    shell.hidden = false;
    document.documentElement.classList.add("is-search-open");
    await initSearch();
  };

  const hide = () => {
    const { shell } = resolveSearchNodes();
    if (!shell) return;

    shell.hidden = true;
    document.documentElement.classList.remove("is-search-open");
  };

  const initializeSearchDialog = () => {
    const { shell } = resolveSearchNodes();

    if (shell?.hidden !== false) {
      document.documentElement.classList.remove("is-search-open");
    }
  };

  initializeSearchDialog();

  if (window.__searchDialogListenersBound !== true) {
    window.__searchDialogListenersBound = true;

    document.addEventListener("click", (event) => {
      const target = event.target;

      if (!(target instanceof Element)) {
        return;
      }

      if (target.closest("[data-search-close]")) {
        hide();
        return;
      }

      if (target.closest("[data-search-open]")) {
        void show();
      }
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") {
        hide();
      }

      if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === "k") {
        event.preventDefault();
        void show();
      }
    });

    document.addEventListener("astro:page-load", initializeSearchDialog);
  }
</script></body></html>
