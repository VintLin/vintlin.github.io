    </marker>
    <marker id="arrow-emerald" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10" fill="none" stroke="#549e39" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 2 L 10 6 L 1 10" fill="none" stroke="#d9534f" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="2667" height="1500" fill="#ffffff"/>
  <text x="160" y="245" font-family="PingFang SC, Hiragino Sans GB, -apple-system, BlinkMacSystemFont, sans-serif" font-size="108" font-weight="600" font-style="italic" letter-spacing="4" fill="#1f2328">选词开关 <tspan dx="28" font-size="72" font-weight="500" fill="#9ca3af" letter-spacing="2">温度与核采样 Temperature &amp; Top-p</tspan></text>
  
        
    <rect x="320" y="460" width="960" height="680" rx="28" fill="#fdebd0" stroke="#e67e22" stroke-width="3.5"/>
    <text x="376" y="565" font-family="PingFang SC, Hiragino Sans GB, -apple-system, BlinkMacSystemFont, sans-serif" font-size="54" font-weight="600" font-style="italic" fill="#111827">Temperature 温度</text>
    <text x="376" y="645" font-family="PingFang SC, Hiragino Sans GB, -apple-system, BlinkMacSystemFont, sans-serif" font-size="42" font-style="italic" fill="#6b7280">- 调节候选词之间的概率差距</text>
<text x="376" y="713" font-family="PingFang SC, Hiragino Sans GB, -apple-system, BlinkMacSystemFont, sans-serif" font-size="42" font-style="italic" fill="#6b7280">- 低温 (0.1)：第一名稳赢，回答保守</text>
<text x="376" y="781" font-family="PingFang SC, Hiragino Sans GB, -apple-system, BlinkMacSystemFont, sans-serif" font-size="42" font-style="italic" fill="#6b7280">- 高温 (1.0)：差距拉平，富有创意</text>
<text x="376" y="849" font-family="PingFang SC, Hiragino Sans GB, -apple-system, BlinkMacSystemFont, sans-serif" font-size="42" font-style="italic" fill="#6b7280"></text>
  
        <!-- Simple visual bars inside left card -->
        <rect x="380" y="920" width="520" height="44" rx="12" fill="#e67e22"/>
        <text x="925" y="956" font-family="PingFang SC, Hiragino Sans GB, -apple-system, BlinkMacSystemFont, sans-serif" font-size="38" font-style="italic" fill="#b45309">learn 45%</text>
        <rect x="380" y="990" width="350" height="44" rx="12" fill="#f59e0b"/>
        <text x="755" y="1026" font-family="PingFang SC, Hiragino Sans GB, -apple-system, BlinkMacSystemFont, sans-serif" font-size="38" font-style="italic" fill="#b45309">predict 30%</text>
        <rect x="380" y="1060" width="180" height="44" rx="12" fill="#fbbf24"/>
        <text x="585" y="1096" font-family="PingFang SC, Hiragino Sans GB, -apple-system, BlinkMacSystemFont, sans-serif" font-size="38" font-style="italic" fill="#b45309">create 15%</text>

        
    <rect x="1390" y="460" width="960" height="680" rx="28" fill="#dce4f7" stroke="#4a72c4" stroke-width="3.5"/>
    <text x="1446" y="565" font-family="PingFang SC, Hiragino Sans GB, -apple-system, BlinkMacSystemFont, sans-serif" font-size="54" font-weight="600" font-style="italic" fill="#111827">Top-p 核采样</text>
    <text x="1446" y="645" font-family="PingFang SC, Hiragino Sans GB, -apple-system, BlinkMacSystemFont, sans-serif" font-size="42" font-style="italic" fill="#6b7280">- 划定入围线，淘汰尾部冷门词</text>
<text x="1446" y="713" font-family="PingFang SC, Hiragino Sans GB, -apple-system, BlinkMacSystemFont, sans-serif" font-size="42" font-style="italic" fill="#6b7280">- 从高到低累加概率至 90% (0.9)</text>
<text x="1446" y="781" font-family="PingFang SC, Hiragino Sans GB, -apple-system, BlinkMacSystemFont, sans-serif" font-size="42" font-style="italic" fill="#6b7280">- 只在前排入围词里随机抽签</text>
<text x="1446" y="849" font-family="PingFang SC, Hiragino Sans GB, -apple-system, BlinkMacSystemFont, sans-serif" font-size="42" font-style="italic" fill="#6b7280"></text>
  
        <rect x="1450" y="910" width="840" height="90" rx="18" fill="#e6f4df" stroke="#70ad47" stroke-width="3"/>
        <text x="1870" y="968" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, -apple-system, BlinkMacSystemFont, sans-serif" font-size="38" font-weight="600" fill="#2e7d32">入围池 (前 90%)：learn / predict / create</text>
        <line x1="1430" y1="1025" x2="2310" y2="1025" stroke="#d9534f" stroke-width="5" stroke-dasharray="14,10"/>
        <text x="1870" y="1095" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, -apple-system, BlinkMacSystemFont, sans-serif" font-size="38" fill="#9ca3af" text-decoration="line-through">淘汰池 (后 10%)：sleep 0.9% / eat 0.1%</text>
      
</svg>